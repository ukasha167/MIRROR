[package]
name = "continuity-wireless"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Dual-protocol wireless transfer and zero-config discovery engine (LocalSend v2.1 + Fast-Stream + Quick Share Receiver)"

[dependencies]
base64 = "0.22.1"
futures-core = "0.3.34"
futures-task = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
